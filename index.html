<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura Exterior Terraza</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --status-ok: #22c55e;
            --status-err: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-main); 
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
        }

        h1 { font-size: 1.1rem; font-weight: 600; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .last-update { font-size: 0.8rem; color: var(--text-muted); }

        .btn-config {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-config:hover { background: rgba(255, 255, 255, 0.15); color: var(--text-main); }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .temp-display { display: flex; align-items: baseline; gap: 4px; }
        .temp-value { font-size: 4.5rem; font-weight: 800; color: var(--accent-blue); line-height: 1; }
        .temp-unit { font-size: 2rem; font-weight: 300; color: var(--text-muted); }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background-color: var(--status-ok); 
            transition: background-color 0.3s;
        }

        .debug-box {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--status-err);
            background: rgba(239, 68, 68, 0.1);
            border: 1px dashed var(--status-err);
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Temperatura Exterior Terraza</h1>
            <div class="header-actions">
                <div class="last-update" id="time-stamp">--:--:--</div>
                <button class="btn-config" onclick="configurarKey()">🔑 Key</button>
            </div>
        </header>

        <div class="main-card">
            <div class="card-row">
                <div class="temp-display">
                    <span class="temp-value" id="temp-exterior">--</span>
                    <span class="temp-unit" id="temp-unit">°C</span>
                </div>
                <div class="status-pill">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Conectando...</span>
                </div>
            </div>
            
            <div class="debug-box" id="debug-box"></div>
        </div>
    </div>

    <script>
        const USERNAME = "descor";
        const FEED_KEY = "terraza-temp";

        function setDebug(msg, isError = true) {
            const debugBox = document.getElementById("debug-box");
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");

            if (msg) {
                debugBox.innerText = `[DEBUG] ${msg}`;
                debugBox.style.display = "block";
            } else {
                debugBox.style.display = "none";
            }

            if (isError) {
                statusDot.style.backgroundColor = "var(--status-err)";
                statusText.innerText = "Error";
            } else {
                statusDot.style.backgroundColor = "var(--status-ok)";
                statusText.innerText = "Online";
            }
        }

        function getAioKey() {
            let key = localStorage.getItem("ADA_AIO_KEY");
            if (!key) {
                key = prompt("Introduce tu Adafruit IO Active Key:");
                if (key) localStorage.setItem("ADA_AIO_KEY", key.trim());
            }
            return key ? key.trim() : null;
        }

        function configurarKey() {
            const nuevaKey = prompt("Introduce tu nueva Adafruit IO Active Key:");
            if (nuevaKey) {
                localStorage.setItem("ADA_AIO_KEY", nuevaKey.trim());
                obtenerTemperatura();
            }
        }

        async function obtenerTemperatura() {
            const aioKey = getAioKey();
            if (!aioKey) {
                document.getElementById("temp-exterior").innerText = "NO KEY";
                setDebug("Falta la API Key en localStorage.");
                return;
            }

            const url = `https://io.adafruit.com/api/v2/${USERNAME}/feeds/${FEED_KEY}/data/last`;

            try {
                const res = await fetch(url, {
                    headers: { "X-AIO-Key": aioKey }
                });

                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem("ADA_AIO_KEY");
                    document.getElementById("temp-exterior").innerText = "KEY ERR";
                    setDebug(`HTTP ${res.status}: Clave AIO no válida o permisos insuficientes.`);
                    return;
                }

                if (res.status === 404) {
                    document.getElementById("temp-exterior").innerText = "404";
                    setDebug(`HTTP 404: Feed '${FEED_KEY}' o usuario '${USERNAME}' no encontrado.`);
                    return;
                }

                if (!res.ok) {
                    document.getElementById("temp-exterior").innerText = "ERR";
                    setDebug(`HTTP Error ${res.status}: ${res.statusText}`);
                    return;
                }

                const data = await res.json();
                
                if (!data || data.value === undefined) {
                    document.getElementById("temp-exterior").innerText = "N/D";
                    setDebug("Respuesta vacía o sin campo 'value'.");
                    return;
                }

                document.getElementById("temp-exterior").innerText = parseFloat(data.value).toFixed(1);
                
                const fecha = new Date(data.created_at);
                document.getElementById("time-stamp").innerText = fecha.toLocaleTimeString([], { hour: '2-2-digit', minute: '2-2-digit' });

                setDebug(null, false); // Todo OK

            } catch (err) {
                console.error(err);
                document.getElementById("temp-exterior").innerText = "NET ERR";
                setDebug(`Excepción JavaScript/Red: ${err.message}`);
            }
        }

        setInterval(obtenerTemperatura, 30000);
        obtenerTemperatura();
    </script>
</body>
</html>
