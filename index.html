<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura Exterior Terraza</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --status-ok: #22c55e;
            --status-err: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            color: var(--text-main); 
            min-height: 100vh;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
        }

        h1 { font-size: 1.1rem; font-weight: 600; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .last-update { font-size: 0.8rem; color: var(--text-muted); }

        .btn-config {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-config:hover { background: rgba(255, 255, 255, 0.15); color: var(--text-main); }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .temp-display { display: flex; align-items: baseline; gap: 4px; }
        .temp-value { font-size: 4.5rem; font-weight: 800; color: var(--accent-blue); line-height: 1; }
        .temp-unit { font-size: 2rem; font-weight: 300; color: var(--text-muted); }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--status-ok); }

        .chart-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chart-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-header { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }

        .range-selector {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .btn-range {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-range.active {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-blue);
        }

        .chart-wrapper { position: relative; height: 180px; width: 100%; }

        .chart-debug {
            font-family: monospace;
            font-size: 0.75rem;
            color: var(--status-err);
            background: rgba(239, 68, 68, 0.1);
            border: 1px dashed var(--status-err);
            padding: 8px 12px;
            border-radius: 8px;
            display: none;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Temperatura Exterior Terraza</h1>
            <div class="header-actions">
                <div class="last-update">Last update: <span id="time-stamp">--:--:--</span></div>
                <button class="btn-config" onclick="configurarKey()">🔑 Key</button>
            </div>
        </header>

        <div class="main-card">
            <div class="temp-display">
                <span class="temp-value" id="temp-exterior">--</span>
                <span class="temp-unit">°C</span>
            </div>
            <div class="status-pill">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header-row">
                <div class="chart-header">Histórico</div>
                <div class="range-selector">
                    <button class="btn-range active" onclick="cambiarRango('1D', this)">1D</button>
                    <button class="btn-range" onclick="cambiarRango('1S', this)">1S</button>
                    <button class="btn-range" onclick="cambiarRango('1M', this)">1M</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="tempChart"></canvas>
            </div>
            <div class="chart-debug" id="chart-debug"></div>
        </div>
    </div>

    <script>
        const USERNAME = "descor";
        const FEED_KEY = "terraza-temp";
        let tempChart = null;
        let rangoActual = '1D';

        function getAioKey() {
            let key = localStorage.getItem("ADA_AIO_KEY");
            if (!key) {
                key = prompt("Introduce tu Adafruit IO Active Key:");
                if (key) localStorage.setItem("ADA_AIO_KEY", key.trim());
            }
            return key ? key.trim() : null;
        }

        function configurarKey() {
            const nuevaKey = prompt("Introduce tu nueva Adafruit IO Active Key:");
            if (nuevaKey) {
                localStorage.setItem("ADA_AIO_KEY", nuevaKey.trim());
                refrescarTodo();
            }
        }

        function cambiarRango(rango, btn) {
            rangoActual = rango;
            document.querySelectorAll('.btn-range').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            obtenerHistorico();
        }

        async function obtenerTemperaturaActual() {
            const aioKey = getAioKey();
            if (!aioKey) {
                document.getElementById("temp-exterior").innerText = "NO KEY";
                return;
            }

            const url = `https://io.adafruit.com/api/v2/${USERNAME}/feeds/${FEED_KEY}/data/last`;

            try {
                const res = await fetch(url, { headers: { "X-AIO-Key": aioKey } });
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem("ADA_AIO_KEY");
                    document.getElementById("temp-exterior").innerText = "KEY ERR";
                    return;
                }
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                document.getElementById("temp-exterior").innerText = parseFloat(data.value).toFixed(1);
                
                const fecha = new Date(data.created_at);
                document.getElementById("time-stamp").innerText = fecha.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            } catch (err) {
                console.error("Error lectura actual:", err);
                document.getElementById("temp-exterior").innerText = "ERR";
            }
        }

        async function obtenerHistorico() {
            const aioKey = getAioKey();
            const debugBox = document.getElementById("chart-debug");
            if (!aioKey) return;

            let url = `https://io.adafruit.com/api/v2/${USERNAME}/feeds/${FEED_KEY}/data`;

            // Construir parámetros de consulta según el rango seleccionado
            if (rangoActual === '1D') {
                url += `?limit=288`; // 24h a razón de 1 dato cada 5 min (288 lecturas)
            } else if (rangoActual === '1S') {
                url += `?resolution=60&limit=168`; // Promedios de 1 hora durante 7 días
            } else if (rangoActual === '1M') {
                url += `?resolution=1440&limit=30`; // Promedios de 1 día durante 30 días
            }

            try {
                const res = await fetch(url, { headers: { "X-AIO-Key": aioKey } });
                if (!res.ok) throw new Error(`API Error (${res.status})`);

                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) throw new Error("Sin datos en el rango seleccionado.");

                const datosReversos = [...data].reverse();

                const labels = datosReversos.map(item => {
                    const d = new Date(item.created_at);
                    if (rangoActual === '1D') {
                        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } else if (rangoActual === '1S') {
                        return `${d.getDate()}/${d.getMonth()+1} ${d.getHours()}:00`;
                    } else {
                        return `${d.getDate()}/${d.getMonth()+1}`;
                    }
                });

                const valores = datosReversos.map(item => parseFloat(item.value));

                renderizarGrafico(labels, valores);
                debugBox.style.display = "none";

            } catch (err) {
                console.error("Error cargando histórico:", err);
                debugBox.innerText = `[DEBUG Histórico] ${err.message}`;
                debugBox.style.display = "block";
            }
        }

        function renderizarGrafico(labels, data) {
            const canvas = document.getElementById('tempChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            if (tempChart) tempChart.destroy();

            tempChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        borderColor: '#38bdf8',
                        borderWidth: 2,
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: rangoActual === '1D' ? 0 : 2 // Oculta puntos en 1D para suavizar la línea
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: '#94a3b8', font: { size: 10 }, maxTicksLimit: 6 } 
                        },
                        y: { 
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }, 
                            ticks: { color: '#94a3b8', font: { size: 10 } } 
                        }
                    }
                }
            });
        }

        function refrescarTodo() {
            obtenerTemperaturaActual();
            obtenerHistorico();
        }

        // Refresco automático cada 5 minutos (300.000 ms)
        setInterval(refrescarTodo, 300000);
        refrescarTodo();
    </script>
</body>
</html>
